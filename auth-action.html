<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Action - FamToolApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-action.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FamToolApp</h1>
        </div>
        <div class="content">
            <h2 id="message-title">Processing your request...</h2>
            <p id="message-body">Please wait a moment.</p>
            
            <div id="password-reset-form">
                <!-- ===== START: CODE CHANGE / कोड में बदलाव यहाँ से शुरू ===== -->
                <div class="password-wrapper">
                    <input type="password" id="new-password" placeholder="Enter new password">
                    <svg id="toggle-password-visibility" class="password-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <!-- ===== END: CODE CHANGE / कोड में बदलाव यहाँ समाप्त ===== -->
                <button id="submit-password-reset" class="button" style="display: inline-block;">Save New Password</button>
            </div>

            <a href="login-signup.html" id="redirect-button" class="button">Go to Login</a>
        </div>
        <div class="footer">
            © Copyright FamToolApp. All Rights Reserved by FamToolApp
        </div>
    </div>

    <script type="module" src="auth-action.js"></script>
</body>
</html>
